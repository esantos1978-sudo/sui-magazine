<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sui Magazine — icono de pestaña (favicon).

  Una única «S» en la misma serif del logotipo (Georgia → Times New Roman →
  serif). A 16 × 16 px la letra ocupa ~12 px de altura y sigue siendo legible;
  «SUI» completo se volvía ilegible a ese tamaño.

  - `y` = 27.73: centra la altura de mayúsculas (0.71 em) y el rebase de la
    curva (0.02 em) en el viewBox de 32 × 32 → centro óptico en y ≈ 16.
  - `x` = 15.9: centra la tinta de la «S» (medida en Chromium: centro ≈ 16.0).
  - Fondo transparente y color stone-900 (#1C1917), según el SPEC.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-labelledby="sui-icon-title">
  <title id="sui-icon-title">Sui Magazine</title>

  <text
    x="15.9"
    y="27.73"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="400"
    fill="#1C1917"
  >S</text>
</svg>
